name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs to write to the repository, and nothing needs a secret.
permissions:
  contents: read

# The server (repository root) and the client (client/) are independent packages, each
# with its own package.json and pnpm-lock.yaml, so each job installs only its own.
# Everything runs on Node 24: the one line the project supports, and the one both hosts run.
jobs:
  server:
    name: Server — lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version named in package.json's "packageManager" field.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The tests run against an in-memory MongoDB, whose binary is downloaded on first use.
      - name: Cache the MongoDB test binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  client:
    name: Client — lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
          cache: true
          cache_dependency_path: client/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # Also the type check: the build runs tsc first.
      - run: pnpm build

  # Real browsers against the built client, the real server and a real MongoDB (in
  # memory). It needs all three packages installed: the suite starts the server from the
  # repository root and builds the client itself.
  e2e:
    name: End-to-end — browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true
          # One lockfile keys the cache of pnpm's store, as in the jobs above; the store
          # is shared by all three installs below.
          cache_dependency_path: e2e/pnpm-lock.yaml

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache the MongoDB test binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Install the server, the client and the suite
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir client install --frozen-lockfile
          pnpm --dir e2e install --frozen-lockfile

      - run: pnpm --dir e2e lint

      # Playwright's own command: the browser build that matches the installed version,
      # and the system libraries it needs.
      - name: Install Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - run: pnpm e2e

      # The report holds a trace of every failed test: each step, with the page as it was.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
